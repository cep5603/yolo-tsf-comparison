# Ultralytics YOLO11 forecasting model with P3/8 - P5/32 multi-scale features
# Time-series inputs are represented as pseudo-images with shape (B, C, 1, W)
# Forecast head implementation: ultralytics/nn/modules/forecast.py

# Parameters
nc: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]       # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]       # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]       # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]      # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]      # 8

# Changes to head definition from base yaml:
# - Upsample only width (height stays 1 for time-series inputs)
# - Replace the detection head with a forecast head

head:
  # FPN from P5 (8) -> P4 (6) -> P3 (4)
  # Input is (B, C, 1, W_eff), where W_eff depends on the caller and any padding.
  # Feature-map widths follow the stride hierarchy (roughly W_eff/32, W_eff/16, W_eff/8).
  # Exact widths depend on the effective input width and convolution padding behavior.
  # Backbone ends at 8.
  
  - [-1, 1, UpW, [2, "nearest"]]                 # 9: P5 -> P4 scale (W*2)
  - [[-1, 6], 1, Concat, [1]]                     # 10: cat P4
  - [-1, 2, C3k2, [512, False]]                   # 11: P4 fused

  - [-1, 1, UpW, [2, "nearest"]]                 # 12: P4 -> P3 scale (W*2)
  - [[-1, 4], 1, Concat, [1]]                     # 13: cat P3
  - [-1, 2, C3k2, [256, False]]                   # 14: P3 fused

  # Forecast head using [P3, P4, P5]
  # P3=14, P4=11, P5=8
  # Pool each selected scale to fixed width 16 before concatenation and readout
  - [[14, 11, 8], 1, Forecast, [36, null, 256, 0.2, "concat", 16]]
